<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configuração · Pablo</title><style>body{margin:0;background:#f5f7fa;color:#17212b;font:15px/1.5 system-ui,sans-serif}.shell{max-width:760px;margin:auto;padding:34px 20px 60px}.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:24px}h1{letter-spacing:-.04em}.eyebrow{color:#0f766e;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}label{display:block;font-weight:700;margin:18px 0 6px}input,textarea{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;box-sizing:border-box}textarea{min-height:84px}.hint{color:#667085;font-size:13px}.actions{display:flex;gap:10px;margin-top:24px}button,a{border:0;border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}button{background:#0f766e;color:white}.back{background:#eef6f5;color:#115e59}.flash{padding:12px 14px;border-radius:10px;background:#ecfdf3;color:#166534;margin-bottom:18px}.flash.error{background:#fef2f2;color:#991b1b}</style></head><body><main class="shell"><div class="eyebrow">Preferências</div><h1>Configuração do monitoramento</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form class="card" method="post"><label for="keywords_any">Palavras-chave</label><textarea id="keywords_any" name="keywords_any">{{ config.keywords_any|join(', ') }}</textarea><div class="hint">Separe termos por vírgulas. Uma vaga entra quando contém pelo menos um termo.</div><label for="exclude_keywords">Termos excluídos</label><textarea id="exclude_keywords" name="exclude_keywords">{{ config.exclude_keywords|join(', ') }}</textarea><label for="check_every_minutes">Intervalo entre buscas (minutos)</label><input id="check_every_minutes" type="number" min="0" step="1" name="check_every_minutes" value="{{ config.check_every_minutes }}"><label for="max_results_per_check">Máximo de novas vagas por busca</label><input id="max_results_per_check" type="number" min="1" step="1" name="max_results_per_check" value="{{ config.max_results_per_check }}"><label for="telegram_bot_token">Token do Telegram</label><input id="telegram_bot_token" type="password" name="telegram_bot_token" value="{{ config.telegram_bot_token }}"><label for="telegram_chat_id">Chat ID do Telegram</label><input id="telegram_chat_id" name="telegram_chat_id" value="{{ config.telegram_chat_id }}"><label><input type="checkbox" name="desktop_notifications" {% if config.desktop_notifications %}checked{% endif %} style="width:auto"> Notificações no desktop</label><div class="actions"><button type="submit">Salvar configuração</button><a class="back" href="{{ url_for('dashboard') }}">Voltar ao painel</a></div></form></main></body></html>
